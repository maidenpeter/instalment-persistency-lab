[theme]
base = "light"
primaryColor = "#2a5d8f"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#eef0f2"
textColor = "#1d2430"
font = "sans-serif"
headingFont = "serif"
codeFont = "monospace"
baseRadius = "0.5rem"
borderColor = "#e3e5e8"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
