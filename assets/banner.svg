<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
  <title id="t">Instalment Persistency Lab</title>
  <desc id="d">Who lapses, what it costs, and which product levers fix it, for health cover that starts on the first instalment. Synthetic portfolio, illustrative only.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4f8"/>
      <stop offset="0.55" stop-color="#fbd9e6"/>
      <stop offset="1" stop-color="#ead9fb"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c2f63"/>
      <stop offset="1" stop-color="#6b3fa0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7a8c8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f7a8c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cdb4f6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#cdb4f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#c2547f" flood-opacity="0.16"/>
    </filter>
    <symbol id="sparkle" viewBox="-10 -10 20 20">
      <path d="M0 -10 C1.2 -2.5 2.5 -1.2 10 0 C2.5 1.2 1.2 2.5 0 10 C-1.2 2.5 -2.5 1.2 -10 0 C-2.5 -1.2 -1.2 -2.5 0 -10 Z"/>
    </symbol>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .pill { font-size: 13px; letter-spacing: 2.2px; fill: #9c2f63; font-weight: 600; }
      .h1 { font-size: 64px; fill: url(#title); font-weight: 700; }
      .lede { font-size: 21px; fill: #5b2a48; }
      .num { font-size: 34px; fill: #9c2f63; font-weight: 700; }
      .lab { font-size: 15px; fill: #6d4560; }
    </style>
  </defs>

  <rect width="1280" height="440" rx="32" fill="url(#bg)"/>
  <circle cx="1130" cy="70" r="230" fill="url(#glow2)"/>
  <circle cx="140" cy="420" r="260" fill="url(#glow1)"/>
  <path d="M0 360 C 240 300, 420 420, 660 370 S 1080 300, 1280 350" fill="none" stroke="#f4b6cf" stroke-width="2" opacity="0.7"/>
  <path d="M0 382 C 260 330, 440 440, 690 392 S 1100 330, 1280 372" fill="none" stroke="#d9c2f5" stroke-width="2" opacity="0.7"/>

  <g fill="#ec6fa0">
    <use href="#sparkle" x="1088" y="54" width="34" height="34"/>
    <use href="#sparkle" x="1146" y="112" width="18" height="18" opacity="0.7"/>
    <use href="#sparkle" x="1196" y="64" width="12" height="12" opacity="0.6"/>
  </g>
  <g fill="#b48ae6">
    <use href="#sparkle" x="1052" y="138" width="14" height="14" opacity="0.8"/>
    <use href="#sparkle" x="58" y="40" width="16" height="16" opacity="0.6"/>
  </g>

  <rect x="64" y="52" width="430" height="34" rx="17" fill="#ffffff" fill-opacity="0.75" stroke="#f3a9c7"/>
  <text x="279" y="74" text-anchor="middle" class="sans pill">SYNTHETIC PORTFOLIO  |  ILLUSTRATIVE ONLY</text>

  <text x="64" y="160" class="serif h1">Instalment Persistency Lab</text>
  <text x="64" y="202" class="sans lede">Who lapses, what it costs, and which product levers fix it,</text>
  <text x="64" y="230" class="sans lede">for health cover that starts on the very first instalment.</text>

  <g filter="url(#soft)">
    <rect x="64" y="268" width="356" height="112" rx="20" fill="#ffffff" fill-opacity="0.82"/>
    <rect x="452" y="268" width="356" height="112" rx="20" fill="#ffffff" fill-opacity="0.82"/>
    <rect x="840" y="268" width="356" height="112" rx="20" fill="#ffffff" fill-opacity="0.82"/>
  </g>
  <text x="92" y="318" class="serif num">56.4%</text>
  <text x="92" y="350" class="sans lab">of policies still in force</text>
  <text x="92" y="369" class="sans lab">after their 10th instalment</text>

  <text x="480" y="318" class="serif num">KES 1.14</text>
  <text x="480" y="350" class="sans lab">paid in claims for every KES 1</text>
  <text x="480" y="369" class="sans lab">a lapsing member paid in</text>

  <text x="868" y="318" class="serif num">KES 48.8m</text>
  <text x="868" y="350" class="sans lab">claims above premium collected</text>
  <text x="868" y="369" class="sans lab">on policies that lapsed</text>
</svg>
