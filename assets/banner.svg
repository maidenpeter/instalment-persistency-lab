<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Instalment Persistency Lab</title>
  <desc id="d">A story in six chapters about health cover that starts on the first instalment: who lapses, what it costs, and which product levers fix it. Synthetic portfolio, illustrative only.</desc>
  <defs>
    <style>
      .serif { font-family: 'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', serif; }
      .sans { font-family: 'Source Sans 3', 'Source Sans Pro', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .kicker { font-size: 14px; letter-spacing: 2.4px; fill: #b5577a; font-weight: 600; }
      .h1 { font-size: 60px; fill: #1d2430; font-weight: 600; }
      .lede { font-size: 21px; fill: #3a4250; }
      .num { font-size: 34px; fill: #1d2430; font-weight: 600; }
      .lab { font-size: 15px; fill: #52514e; }
      .fine { font-size: 13px; fill: #6b6a66; }
    </style>
  </defs>
  <rect width="1280" height="400" rx="20" fill="#f9f9f7"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="20" fill="none" stroke="#e3e5e8"/>

  <path d="M70 52 C71 60 73 62 81 63 C73 64 71 66 70 74 C69 66 67 64 59 63 C67 62 69 60 70 52 Z" fill="#b5577a"/>
  <text x="92" y="69" class="sans kicker">A STORY IN SIX CHAPTERS</text>

  <text x="60" y="142" class="serif h1">Instalment Persistency Lab</text>
  <text x="60" y="184" class="sans lede">Who lapses, what it costs, and which product levers fix it, for health cover</text>
  <text x="60" y="212" class="sans lede">that starts on the very first instalment.</text>

  <rect x="60" y="250" width="360" height="104" rx="10" fill="#ffffff" stroke="#e3e5e8"/>
  <rect x="460" y="250" width="360" height="104" rx="10" fill="#ffffff" stroke="#e3e5e8"/>
  <rect x="860" y="250" width="360" height="104" rx="10" fill="#ffffff" stroke="#e3e5e8"/>
  <text x="84" y="296" class="sans num">56.4%</text>
  <text x="84" y="324" class="sans lab">of policies still in force after</text>
  <text x="84" y="342" class="sans lab">their 10th instalment</text>
  <text x="484" y="296" class="sans num">KES 1.14</text>
  <text x="484" y="324" class="sans lab">paid in claims for every KES 1</text>
  <text x="484" y="342" class="sans lab">a lapsing member paid in</text>
  <text x="884" y="296" class="sans num">KES 48.8m</text>
  <text x="884" y="324" class="sans lab">claims above premium collected</text>
  <text x="884" y="342" class="sans lab">on policies that lapsed</text>

  <text x="1220" y="384" text-anchor="end" class="sans fine">Synthetic portfolio. Illustrative only.</text>
</svg>
