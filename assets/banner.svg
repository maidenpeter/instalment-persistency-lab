<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Instalment Persistency Lab: pay-as-you-go health cover</title>
  <desc id="d">A story in six chapters about health cover paid in instalments: who lapses, what it costs, and which product levers fix it. Synthetic portfolio, illustrative only.</desc>
  <defs>
    <radialGradient id="bg" cx="78%" cy="18%" r="95%">
      <stop offset="0" stop-color="#20232E"/>
      <stop offset="1" stop-color="#0F1117"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8960C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E8960C" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#E8960C" stop-opacity="0"/>
    </linearGradient>
    <style>
      .serif { font-family: 'EB Garamond', Garamond, Georgia, 'Times New Roman', serif; }
      .sans { font-family: 'Source Sans 3', 'Source Sans Pro', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .tag { font-size: 14px; letter-spacing: 3.2px; fill: #E8A33A; font-weight: 700; }
      .h1 { font-size: 64px; fill: #FAFAFA; font-weight: 600; }
      .lede { font-size: 21px; fill: #c9c6bc; }
      .num { font-size: 38px; fill: #FFC24B; font-weight: 600; }
      .lab { font-size: 15px; fill: #b4b1a8; }
      .fine { font-size: 13px; fill: #888680; }
    </style>
  </defs>
  <rect width="1280" height="420" rx="18" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="418.5" rx="17.5" fill="none" stroke="#E8960C" stroke-opacity="0.35"/>

  <g transform="translate(60,52) scale(1.25)">
    <g stroke="#0F1117" stroke-width="0.6" stroke-linejoin="round">
      <polygon points="32,3 17,22 32,32" fill="#FFD27A"/>
      <polygon points="32,3 32,32 47,22" fill="#FFC24B"/>
      <polygon points="32,3 3,30 17,22" fill="#FFCF6B"/>
      <polygon points="32,3 47,22 61,30" fill="#E8960C"/>
      <polygon points="3,30 17,22 32,32" fill="#F0A927"/>
      <polygon points="47,22 61,30 32,32" fill="#C77A00"/>
      <polygon points="3,30 32,32 18,42" fill="#C77A00"/>
      <polygon points="61,30 46,42 32,32" fill="#9E6200"/>
      <polygon points="32,32 18,42 32,61" fill="#B36E00"/>
      <polygon points="32,32 32,61 46,42" fill="#8A5600"/>
      <polygon points="3,30 18,42 32,61" fill="#7A4C00"/>
      <polygon points="61,30 32,61 46,42" fill="#6B4200"/>
    </g>
  </g>
  <text x="160" y="110" class="serif h1">Instalment Persistency Lab</text>
  <text x="162" y="140" class="sans tag">PAY-AS-YOU-GO HEALTH COVER</text>

  <text x="60" y="200" class="sans lede">Who lapses, what it costs, and which product levers fix it, for health cover that</text>
  <text x="60" y="228" class="sans lede">starts on a 10% deposit and is paid off in monthly instalments. A story in six chapters.</text>

  <rect x="60" y="256" width="1160" height="1" fill="url(#rule)"/>

  <text x="60" y="318" class="serif num">57.3%</text>
  <text x="60" y="346" class="sans lab">of policies still in force after their 10th instalment</text>
  <text x="460" y="318" class="serif num">KES 1.14</text>
  <text x="460" y="346" class="sans lab">paid in claims for every KES 1 a lapsing member paid in</text>
  <text x="860" y="318" class="serif num">KES 50.1m</text>
  <text x="860" y="346" class="sans lab">claims above premium collected on lapsed policies</text>

  <text x="1220" y="398" text-anchor="end" class="sans fine">Synthetic portfolio. Illustrative only.</text>
</svg>
